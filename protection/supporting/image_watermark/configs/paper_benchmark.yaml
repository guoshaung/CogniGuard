# Frozen, fail-closed configuration for the first defensible server run.
# Build the portable manifest after staging all enabled datasets:
#   python -m protection.supporting.image_watermark.experiments.build_manifest \
#     --config protection/supporting/image_watermark/configs/paper_benchmark.yaml \
#     --output outputs/image_watermark_manifests/paper_formal_3000_v2.jsonl

experiment:
  name: cogniguard_image_watermark_core
  strict_paper_mode: true
  fail_fast: true
  split: test
  seeds: [20260802, 20260803, 20260804]
  max_samples: 0
  api_timeout_seconds: 900
  bootstrap_iterations: 10000
  bootstrap_seed: 20260802
  # A formal traditional-attack row retains the exact PNG SHA-256 but removes
  # the temporary attacked PNG after successful verification. With 35 attack
  # conditions this prevents tens of GB of reproducible intermediates from
  # exhausting the server data disk.
  traditional_attack_artifact_retention: hash_only
  # All method runners must use these exact versions for the shared attack
  # implementation so JPEG/resize/filter pixels cannot drift by environment.
  required_attack_runtime:
    numpy: 1.26.4
    Pillow: 10.4.0
  output_root: ../../../var/outputs/image_watermark_paper

split:
  seed: 20260802
  train_ratio: 0.70
  dev_ratio: 0.10

manifest:
  # Kept separate from paper_core.jsonl, which is the frozen synthetic pilot.
  path: ../../../var/outputs/image_watermark_manifests/paper_formal_3000_v2.jsonl
  verify_hashes: true
  # The adjacent .jsonl.lock.json binds these bytes to this config and to all
  # published external-dataset locks. Formal runners fail closed without it.
  require_lock: true

data_requirements:
  # Quotas are exact after deterministic selection. The builder also rejects
  # duplicate image SHA-256 values and source-family split leakage globally.
  expected_total_samples: 3000
  minimum_test_samples: 500
  minimum_datasets: 4
  minimum_domains: 4
  require_nonempty_source_family: true
  require_unique_source_family: true
  expected_unique_source_families: 3000
  require_deterministic_splits: true
  required_evaluation_split: test
  require_max_samples_zero: true

metrics:
  require_reference_ssim: true
  lpips:
    enabled: true
    required: true
    network: alex
    device: auto

# Every root is resolved relative to this YAML on both Windows and Linux. The
# JSONL stores only source_dataset + relative_path, never a machine path.
datasets:
  - name: cogniguard_edufig_v2
    enabled: true
    # v1 and paper_core.jsonl are retained as immutable pilot artifacts.
    root: ../../../data/image_watermark/cogniguard_edufig_v2
    glob: "**/*.png"
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    max_samples: 1200
    required_samples: 1200
    compute_sha256: true
    license_id: CC0-1.0
    license_url: https://creativecommons.org/publicdomain/zero/1.0/
    provenance: programmatic:cogniguard_edufig_v2

  - name: open_images_v7_license_audited
    enabled: true
    root: ../../../data/image_watermark/open_images_v7_license_audited
    glob: "**/*"
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    require_dataset_lock: true
    dataset_lock: dataset.lock.json
    dataset_plan: plan.jsonl
    max_samples: 600
    required_samples: 600
    compute_sha256: true
    license_id: per-file-required
    license_url: https://storage.googleapis.com/openimages/web/factsfigures_v7.html
    provenance: external:per_file_audited

  - name: wikimedia_education_license_audited
    # Disabled operationally after repeated HTTP 503 responses from the target
    # server. This is not a finding that Wikimedia licenses are ineligible;
    # per-file license and attribution auditing remains required if re-enabled.
    enabled: false
    root: ../../../data/image_watermark/wikimedia_education_license_audited
    glob: "**/*"
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    require_dataset_lock: true
    dataset_lock: dataset.lock.json
    dataset_plan: plan.jsonl
    max_samples: 400
    compute_sha256: true
    license_id: per-file-required
    license_url: https://commons.wikimedia.org/wiki/Commons:Reusing_content_outside_Wikimedia/en
    provenance: official:wikimedia_commons_api:disabled_server_http_503

  - name: nasa_images_policy_audited
    enabled: true
    root: ../../../data/image_watermark/nasa_images_policy_audited
    glob: "**/*"
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    require_dataset_lock: true
    dataset_lock: dataset.lock.json
    dataset_plan: plan.jsonl
    max_samples: 400
    required_samples: 400
    compute_sha256: true
    # This is a policy/audit label, not a CC0 or blanket public-domain claim.
    license_id: NASA-MEDIA-USAGE-GUIDELINES
    license_url: https://www.nasa.gov/nasa-brand-center/images-and-media/
    provenance: official:nasa_images_api:policy_audited

  - name: met_open_access_cc0
    enabled: true
    root: ../../../data/image_watermark/met_open_access_cc0
    glob: "**/*"
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    require_dataset_lock: true
    dataset_lock: dataset.lock.json
    dataset_plan: plan.jsonl
    max_samples: 800
    required_samples: 800
    compute_sha256: true
    license_id: CC0-1.0
    license_url: https://creativecommons.org/publicdomain/zero/1.0/
    provenance: official:met_collection_api:open_access_public_domain

  # External validation tracks are disabled until their original data and
  # redistribution constraints have been audited on the server.
  - name: coco_license_audited
    enabled: false
    root: ../../../data/image_watermark/coco_license_audited
    glob: "**/*"
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    max_samples: 0
    compute_sha256: true
    license_id: dataset-terms-not-primary-paper-track
    license_url: https://cocodataset.org/#termsofuse
    provenance: external:coco_disabled_license_scope

  - name: magicbrush_external
    enabled: false
    root: ../../../data/image_watermark/magicbrush
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    license_id: CC-BY-4.0
    license_url: https://github.com/OSU-NLP-Group/MagicBrush/blob/main/LICENSE
    provenance: external:magicbrush

  - name: div2k_external
    enabled: false
    root: ../../../data/image_watermark/div2k
    metadata_jsonl: metadata.jsonl
    require_sidecar_metadata: true
    license_id: academic-research-only
    license_url: https://data.vision.ee.ethz.ch/cvl/DIV2K/
    provenance: external:div2k

methods:
  - id: editguard_wrapper
    kind: sce_locguard_api
    base_url: http://127.0.0.1:8010
    enabled: true

  # Add a method only after an official implementation has been adapted to the
  # same API contract. Literature values and local approximations are forbidden.
  - id: trustmark_official
    kind: sce_locguard_api
    base_url: http://127.0.0.1:8110
    enabled: false
  - id: stegastamp_official
    kind: sce_locguard_api
    base_url: http://127.0.0.1:8120
    enabled: false

attacks:
  traditional:
    - name: clean
      family: clean
    - name: jpeg
      family: compression
      grid: [{quality: 90}, {quality: 70}, {quality: 50}, {quality: 30}]
    - name: webp
      family: compression
      grid: [{quality: 90}, {quality: 70}, {quality: 50}]
    - name: resize
      family: geometry
      grid: [{scale: 0.50}, {scale: 0.75}, {scale: 1.25}, {scale: 1.50}]
    - name: random_crop
      family: geometry
      grid: [{keep: 0.90}, {keep: 0.75}, {keep: 0.50}]
    - name: rotate
      family: geometry
      grid: [{degrees: 2}, {degrees: 5}, {degrees: 10}]
    - name: gaussian_blur
      family: degradation
      grid: [{radius: 0.5}, {radius: 1.0}, {radius: 2.0}]
    - name: gaussian_noise
      family: degradation
      grid: [{sigma: 2.0}, {sigma: 5.0}, {sigma: 10.0}]
    - name: brightness
      family: photometric
      grid: [{factor: 0.8}, {factor: 1.2}]
    - name: contrast
      family: photometric
      grid: [{factor: 0.8}, {factor: 1.2}]
    - name: saturation
      family: photometric
      grid: [{factor: 0.7}, {factor: 1.3}]
    - name: median_filter
      family: degradation
      grid: [{size: 3}, {size: 5}]
    - name: erasing
      family: removal
      grid: [{area_ratio: 0.05}, {area_ratio: 0.15}, {area_ratio: 0.25}]

  aigc:
    enabled: true
    max_samples: 600
    sample_seed: 20260802
    specs:
      - name: object_removal
        family: aigc_local_edit
        requires_aigc: true
        grid:
          - {mode: localized_composite, prompt: "clean educational background"}
      - name: inpainting
        family: aigc_local_edit
        requires_aigc: true
        grid:
          - {mode: localized_composite, prompt: "replace the masked region with a neutral diagram element"}
      - name: local_replacement
        family: aigc_local_edit
        requires_aigc: true
        grid:
          - {mode: localized_composite, prompt: "a different geometric teaching symbol"}
      - name: local_style_edit
        family: aigc_local_edit
        requires_aigc: true
        grid:
          - {mode: localized_composite, prompt: "restyle the masked region as a chalkboard illustration"}
