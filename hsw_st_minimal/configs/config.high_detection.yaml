# 强检测预设：大 delta → Z 更高、检出更容易，但 logits 偏置重，教学文本往往更不自然
# 用法: python src/main.py --config configs/config.high_detection.yaml --mode demo
model:
  provider: "huggingface"
  local_model_name: "Qwen/Qwen2.5-3B-Instruct"
  device: "auto"
  dtype: "auto"
  max_new_tokens: 256
  rewrite_max_new_tokens: 220
  temperature: 0.7
  rewrite_temperature: 0.36
  repetition_penalty: 1.15
  top_p: 0.9
  openai_base_url: "https://api.deepseek.com"
  openai_api_key: ""
  openai_model: "deepseek-chat"

watermark:
  key: "demo_secret_key"
  key_id: "key_default"
  gamma: 0.25
  delta: 2.0
  window_size: 4
  z_threshold: 4.0
  local_window_tokens: 80
  local_window_stride: 20

data:
  dataset_path: "data/sample_edu_dataset.jsonl"
  teacher_resources_path: "data/teacher_resources.jsonl"
  clean_baseline_path: "data/clean_baseline.jsonl"
  terms_path: "data/protected_terms_math.txt"
  num_samples: 50
  num_clean_baselines: 30
  subject: "math"
  random_seed: 42

experiment:
  run_attacks: true
  use_sentence_embedding: false
  save_intermediate: true
  random_seed: 42
  ablation: "full"

paths:
  output_dir: "outputs"
  output_run_subdir: true
