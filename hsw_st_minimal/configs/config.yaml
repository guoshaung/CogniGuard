# HSW-ST 最低实现版
# device/dtype: auto = 有 CUDA 则 GPU+float16，否则 CPU+float32；也可写死 cuda / cpu
# 完整 KGW 须用 Hugging Face 因果模型（Ollama 无法 logits 水印）
# provider: openai = 仅演示改写+日志，无真实 KGW
model:
  provider: "huggingface"
  # 默认 3B：6–8G 显存下比 1.5B 更稳；仍 OOM 可改 1.5B 或本地量化权重路径
  local_model_name: "Qwen/Qwen2.5-3B-Instruct"
  device: "auto"
  dtype: "auto"
  max_new_tokens: 256
  # 改写长度略短可减少胡编；与占位符无关的长输出可单独限制
  rewrite_max_new_tokens: 170
  temperature: 0.7
  # 最小改动润色：低温减少胡编；仍略采样以配合 KGW 绿表
  rewrite_temperature: 0.26
  repetition_penalty: 1.06
  top_p: 0.9
  # OpenAI 兼容接口（DeepSeek: base_url https://api.deepseek.com ，model deepseek-chat）
  openai_base_url: "https://api.deepseek.com"
  openai_api_key: ""  # 可留空，使用环境变量 DEEPSEEK_API_KEY 或 OPENAI_API_KEY
  openai_model: "deepseek-chat"

# delta 与 z_threshold 需同量级校准：delta 过小 → Z 上不去 → WDR≈0；阈值过高 → 永远判未水印
# 默认取「可检出 + 尽量少扭曲语言」的平衡；极高检出见 config.high_detection.yaml
watermark:
  key: "demo_secret_key"
  key_id: "key_default"
  gamma: 0.25
  delta: 1.75
  window_size: 4
  z_threshold: 2.85
  local_window_tokens: 80
  local_window_stride: 20

data:
  dataset_path: "data/sample_edu_dataset.jsonl"
  teacher_resources_path: "data/teacher_resources.jsonl"
  clean_baseline_path: "data/clean_baseline.jsonl"
  terms_path: "data/protected_terms_math.txt"
  num_samples: 50
  num_clean_baselines: 30
  subject: "math"
  random_seed: 42

experiment:
  run_attacks: true
  use_sentence_embedding: false
  save_intermediate: true
  random_seed: 42
  # ablation: full | no_watermark | kgw_only | protect_only
  ablation: "full"
  # 防止「二次函数→椭圆」类事故；与草稿过像则抬高温度再生成一轮
  content_fidelity:
    enabled: true
    max_attempts: 5
    max_draft_similarity: 0.985
    min_term_coverage: 1.0
    fallback_to_draft_on_drift: true

paths:
  output_dir: "outputs"
  # true：每次运行写入 outputs/run_YYYYMMDD_HHMMSS_微秒/，避免多次覆盖；false 仍写扁平 outputs/
  output_run_subdir: true
